# Public, isolated anonymous workspaces; configure the provider key privately.
# This blueprint does not create persistent storage.
services:
  - type: web
    name: orgmind-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: EPHEMERAL_STORAGE
        value: "true"
      - key: GENERATION_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: baidu/ernie-5.5-flash-preview:free
      - key: OPENAI_API_KEY
        sync: false
      - key: GENERATION_TIMEOUT_SECONDS
        value: "30"
