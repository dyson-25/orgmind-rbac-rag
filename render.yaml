
# OrgMind production service
# Credential-based sign-in; public role switching is disabled.
# OpenRouter API key must be configured privately in the Render Dashboard.

services:
  - type: web
    name: orgmind-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health

    envVars:
      - key: APP_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: ALLOW_DEMO_PERSONA
        value: "false"

      - key: DATA_DIR
        value: /app/data

      - key: GENERATION_PROVIDER
        value: openai

      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: OPENAI_MODEL
        value: baidu/ernie-5.5-flash-preview:free

      - key: EMBEDDING_PROVIDER
        value: local
